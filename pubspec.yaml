name: power_tool_tracking
description: Enterprise-grade Power Tool Tracking application for construction site management with complete offline support.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5
  bloc_concurrency: ^0.3.0

  # Networking
  dio: ^5.7.0

  # Local Database (Drift - Offline First)
  drift: ^2.22.0
  drift_flutter: ^0.3.0
  sqlite3_flutter_libs: ^0.6.0+eol

  # Secure Storage
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.3.3

  # Dependency Injection
  get_it: ^9.2.1
  injectable: ^3.0.0

  # Navigation
  go_router: ^17.3.0

  # Firebase
  firebase_core: ^4.10.0
  firebase_analytics: ^12.4.2
  firebase_crashlytics: ^5.2.3
  firebase_messaging: ^16.3.0
  firebase_remote_config: ^6.5.2

  # Environment Configuration
  flutter_dotenv: ^6.0.1

  # Code Generation Annotations
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Utilities
  logger: ^2.5.0
  connectivity_plus: ^7.1.1
  path_provider: ^2.1.5
  path: ^1.9.0
  intl: ^0.20.2
  uuid: ^4.5.1
  crypto: ^3.0.6

  # UI Components
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.17
  lottie: ^3.2.0
  fluttertoast: ^9.1.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.13
  freezed: ^3.2.6-dev.1
  json_serializable: ^6.8.0
  drift_dev: ^2.22.0
  injectable_generator: ^3.0.2

  # Testing
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

  # Linting
  flutter_lints: ^6.0.0

  # App Icons
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - .env.dev
    - .env.uat
    - .env.prod


flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1565C0"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
